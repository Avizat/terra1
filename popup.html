<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
    }

    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      box-sizing: border-box;
    }

    h2 {
      margin: 0 0 12px 0;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    input, select, button {
      font-family: inherit;
      border-radius: 6px;
      font-size: 13px;
      padding: 8px 10px;
      box-sizing: border-box;
    }

    input, select {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    button.btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.btn-primary:hover {
      background: var(--primary-hover);
    }

    .category-group {
      margin-top: 12px;
    }

    .category-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--primary);
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
      margin-bottom: 8px;
    }

    .site-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .site-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 6px;
    }

    .site-link {
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
    }

    .site-link:hover {
      color: var(--primary);
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--subtext);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
    }

    .delete-btn:hover {
      color: var(--danger);
    }

    .empty-msg {
      font-size: 12px;
      color: var(--subtext);
      text-align: center;
      margin: 16px 0;
    }
  </style>
</head>
<body>

  <h2>📌 SiteStash</h2>

  <!-- Quick Add Box -->
  <div class="card">
    <div class="form-group">
      <input type="text" id="siteTitle" placeholder="Website Title">
      <input type="url" id="siteUrl" placeholder="https://example.com">
      
      <select id="siteCategory">
        <option value="App Creation">App Creation</option>
        <option value="Designing">Designing</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Other">Other</option>
      </select>

      <button id="saveBtn" class="btn-primary">+ Save Website</button>
    </div>
  </div>

  <!-- Saved Categories View -->
  <div id="categoriesContainer"></div>

  <script src="popup.js"></script>
</body>
</html>
